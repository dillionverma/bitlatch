<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bitlatch passkey</title>
    <meta name="manifest.exclude" content="['safari']" />
  </head>
  <body>
    <header class="toolbar">
      <span class="mark" aria-hidden="true"></span>
      <strong>Bitlatch</strong><span id="site"></span>
    </header>
    <main>
      <h1 id="title">Connecting to Bitlatch</h1>
      <p id="description">Your vault stays on your computer.</p>
      <div id="passkeys" role="list" aria-label="Passkeys" hidden></div>
      <div id="account" class="account" hidden>
        <span class="tile" aria-hidden="true"></span>
        <span class="item-text"
          ><span id="account-name" class="item-name"></span
          ><span id="account-site" class="item-sub"></span
        ></span>
      </div>
      <button id="primary" class="primary" type="button" hidden></button>
    </main>
    <p id="message" role="status" aria-live="polite" hidden></p>
    <footer>
      <button id="fallback" type="button">Use another device</button
      ><button id="cancel" type="button">Cancel</button>
    </footer>
    <script type="module" src="../../passkeys/window.ts"></script>
  </body>
</html>
