nodeLinker: hoisted
overrides:
  multer: '^2.3.0'
  tmp: '^0.2.6'
  vite: 'npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0'
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  fsevents: true
minimumReleaseAgeExclude:
  - framer-motion@13.4.2
  - motion-dom@13.4.2
  - motion@13.4.2

# Vite+ exposes Vite 8 APIs under its own release version.
peerDependencyRules:
  allowedVersions:
    vite: '1.0.0-rc.0'
