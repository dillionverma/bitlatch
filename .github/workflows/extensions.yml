name: Extension artifacts
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'apps/raycast/**'
      - 'scripts/package-raycast.mjs'
      - 'packages/shared/**'
      - 'vite.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'LICENSE'
      - 'README.md'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/extensions.yml'
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:typecheck
      - run: pnpm run extension:zip
      - run: pnpm run package:raycast
      - uses: actions/upload-artifact@v4
        with:
          name: release-browser-extensions
          path: apps/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: release-raycast
          path: release/latch-*-raycast.zip
          if-no-files-found: error
          retention-days: 14
