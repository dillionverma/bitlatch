name: Browser extension artifacts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/extension/**'
      - 'src/shared/**'
      - 'assets/extension-public/**'
      - 'assets/extension.json'
      - 'wxt.config.ts'
      - 'vite.config.mjs'
      - 'tsconfig.extension.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/build-extensions.mjs'
      - '.github/workflows/extensions.yml'
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extension:typecheck
      - run: pnpm run extension:zip
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: .output/*.zip
          retention-days: 14
