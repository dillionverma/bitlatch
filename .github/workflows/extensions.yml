name: Browser extension artifacts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/extension/**'
      - 'src/shared/**'
      - 'assets/extension-public/**'
      - 'assets/extension.json'
      - 'wxt.config.ts'
      - 'tsconfig.extension.json'
      - 'package*.json'
      - 'scripts/build-extensions.mjs'
      - '.github/workflows/extensions.yml'
permissions:
  contents: read
jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run extension:typecheck
      - run: npm run extension:zip
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: .output/*.zip
          retention-days: 14
